server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name pasport-bezopasnosty.ru;

    root /var/www/pasport-bezopasnosty.ru/current;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml;


    ssl_certificate /etc/letsencrypt/live/pasport-bezopasnosty.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pasport-bezopasnosty.ru/privkey.pem;
    include /etc/nginx/snippets/options-ssl-pasport-bezopasnosty.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;



    # NGINX HEALTHCHECK
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }


    # FEDERAL_ONLY_GEO_V1
    # Старые браузерные сборки тоже остаются на федеральном сайте.
    location = /api/geo {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"ok":true,"kind":"federal","targetOrigin":"https://pasport-bezopasnosty.ru"}';
    }

    # API Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:8787;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        client_max_body_size 10M;
    }


  # React Admin
location = /admin {
    return 302 /admin/;
}

location = /admin.html {
    root /var/www/pasport-bezopasnosty.ru/current;
}

location ^~ /admin/ {
    root /var/www/pasport-bezopasnosty.ru/current;

    try_files $uri /admin.html;
}



    # Assets Vite
location /assets/ {
    alias /var/www/pasport-bezopasnosty.ru/current/assets/;

    expires 1y;
    add_header Cache-Control "public, immutable";
}


    # Статика сайта

location /uploads/ {

    alias /var/www/pasport-bezopasnosty.ru/shared/uploads/;

    expires 30d;

    add_header Cache-Control "public";

}


    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

# BLOG_STATIC_WITH_LEGACY_REDIRECT_V1

location = /blog {
    return 301 /blog/;
}


location ^~ /blog/ {
    try_files $uri $uri/ @passport_blog_fallback;
}


location @passport_blog_fallback {
    proxy_pass http://127.0.0.1:8787;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}


location / {
        try_files $uri $uri/ =404;
    }


    # SSR / Node
    location @node {
        proxy_pass http://127.0.0.1:8787;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
