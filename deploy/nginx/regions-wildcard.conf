server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name ~^(?<region>[a-z0-9-]+)\.pasport-bezopasnosty\.ru$;

    # Legacy city slug: gay -> gai.
    if ($region = gay) {
        return 301 https://pasport-bezopasnosty.ru$request_uri;
    }

    # Legacy locality slug: aleksandrov-gay -> aleksandrov-gai.
    if ($region = aleksandrov-gay) {
        return 301 https://pasport-bezopasnosty.ru$request_uri;
    }

    # Legacy locality slug: krasnyy-gay -> krasnyy-gai.
    if ($region = krasnyy-gay) {
        return 301 https://pasport-bezopasnosty.ru$request_uri;
    }

    ssl_certificate /etc/nginx/ssl/pasport-bezopasnosty.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/pasport-bezopasnosty.ru/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/pasport-bezopasnosty.ru/geo-pages/current/$region;
    index index.html;

    charset utf-8;

    # Compression for text-based frontend assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml;


    # Yandex Webmaster verification for all generated subdomains.
    location = /yandex_1e3c541b5e153c46.html {
        alias /var/www/pasport-bezopasnosty.ru/shared/yandex_1e3c541b5e153c46.html;
        default_type text/html;
    }

    # Не отдаём случайные поддомены,
    # для которых нет сгенерированной страницы.



    # Object-type passport pages are federal-only.
    # Regional URLs permanently redirect to the canonical federal page.
    location ~ ^/(pasport-bezopasnosti-obekta-zdravoohraneniya|pasport-bezopasnosti-gostinicy|pasport-bezopasnosti-obrazovatelnoj-organizacii|pasport-bezopasnosti-obekta-kultury|pasport-bezopasnosti-torgovogo-obekta|pasport-bezopasnosti-obekta-sporta|pasport-bezopasnosti-mesta-massovogo-prebyvaniya-lyudej|pasport-bezopasnosti-obekta-socialnoj-zashchity)/?$ {
        return 301 https://pasport-bezopasnosty.ru/$1/$is_args$args;
    }


    location /api/ {
        proxy_pass http://127.0.0.1:8787;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        client_max_body_size 64k;
    }

    # Общая статика для всех регионов.
    location ^~ /assets/ {
        alias /var/www/pasport-bezopasnosty.ru/shared/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /images/ {
        alias /var/www/pasport-bezopasnosty.ru/shared/images/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ^~ /styles/ {
        alias /var/www/pasport-bezopasnosty.ru/shared/styles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /favicon.png {
        alias /var/www/pasport-bezopasnosty.ru/shared/favicon.png;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /favicon.svg {
        alias /var/www/pasport-bezopasnosty.ru/shared/favicon.svg;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /apple-touch-icon.png {
        alias /var/www/pasport-bezopasnosty.ru/shared/apple-touch-icon.png;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    location = /sitemap.xml {
        return 301 https://pasport-bezopasnosty.ru/sitemap.xml;
    }

    # Админка единая — только на основном домене.
    location = /admin {
        return 302 https://pasport-bezopasnosty.ru/admin/;
    }

    location ^~ /admin/ {
        return 302 https://pasport-bezopasnosty.ru$request_uri;
    }

    # Temporary/internal diagnostic URLs must never fall back to the SPA.
    location ~ ^/__diag_.*\.html$ {
        return 404;
    }

    location / {
        return 301 https://pasport-bezopasnosty.ru$request_uri;
    }

    location ~ /\. {
        deny all;
    }
}


server {
    listen 80;
    listen [::]:80;

    server_name ~^(?<region>[a-z0-9-]+)\.pasport-bezopasnosty\.ru$;

    # Legacy city slug: gay -> gai.
    if ($region = gay) {
        return 301 https://pasport-bezopasnosty.ru$request_uri;
    }

    # Legacy locality slug: aleksandrov-gay -> aleksandrov-gai.
    if ($region = aleksandrov-gay) {
        return 301 https://pasport-bezopasnosty.ru$request_uri;
    }

    # Legacy locality slug: krasnyy-gay -> krasnyy-gai.
    if ($region = krasnyy-gay) {
        return 301 https://pasport-bezopasnosty.ru$request_uri;
    }

    return 301 https://pasport-bezopasnosty.ru$request_uri;
}
