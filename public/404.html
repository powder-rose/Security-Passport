<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Страница не найдена — БОЙКОВГРУПП
  </title>

  <meta
    name="robots"
    content="noindex,follow"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      font-family:
        Inter,
        Arial,
        sans-serif;
      color: #10243e;
      background: #f5f7fa;
    }

    .page {
      width: min(760px, 100%);
    }

    .code {
      margin: 0 0 16px;
      font-size: clamp(72px, 16vw, 150px);
      line-height: .85;
      font-weight: 800;
      letter-spacing: -.06em;
      color: #163f73;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(30px, 5vw, 54px);
      line-height: 1.05;
      letter-spacing: -.03em;
    }

    p {
      max-width: 600px;
      margin: 0 0 30px;
      font-size: 18px;
      line-height: 1.55;
      color: #53657a;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 24px;
      border-radius: 8px;
      color: #fff;
      background: #163f73;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      opacity: .92;
    }
  </style>
</head>

<body>
  <main class="page">
    <div
      class="code"
      aria-hidden="true"
    >
      404
    </div>

    <h1>
      Страница не найдена
    </h1>

    <p>
      Возможно, адрес страницы изменился
      или был указан неправильно.
      Перейдите на главную страницу сайта.
    </p>

    <a href="/">
      Перейти на главную
    </a>
  </main>
</body>
</html>
