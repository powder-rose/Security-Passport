<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Страница не найдена — БОЙКОВГРУПП</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f7fb;
      color: #102246;
      font: 16px/1.6 Arial, sans-serif;
    }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    section {
      width: min(100%, 640px);
      padding: clamp(28px, 6vw, 56px);
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 16px 48px rgba(16, 34, 70, .08);
    }
    .brand {
      margin: 0 0 32px;
      color: #102c60;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .08em;
    }
    .number {
      display: inline-block;
      margin: 0 0 16px;
      color: #102c60;
      font-size: clamp(76px, 16vw, 120px);
      font-weight: 800;
      line-height: 1;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.2;
    }
    p { margin: 0 0 28px; }
    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 8px;
      background: #102c60;
      color: #fff;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #699cf5; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <section>
      <p class="brand">БОЙКОВГРУПП</p>
      <div class="number" aria-hidden="true">404</div>
      <h1>Страница не найдена</h1>
      <p>Проверьте адрес или перейдите на главную страницу.</p>
      <a href="/">На главную</a>
    </section>
  </main>
</body>
</html>
